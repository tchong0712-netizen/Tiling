    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: .35; }
    .field-label { display:block; margin-bottom:.35rem; color:#475569; font-size:.75rem; font-weight:800; }
    .field, .select, .textarea {
      width:100%; border:1px solid #cbd5e1; background:#fff; color:#0f172a;
      border-radius:.5rem; padding:.62rem .72rem; font-size:.92rem; outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    .textarea { min-height:6.5rem; resize:vertical; line-height:1.45; }
    .field:focus, .select:focus, .textarea:focus { border-color:#0f766e; box-shadow:0 0 0 3px rgba(15,118,110,.14); }
    .panel { border:1px solid #e2e8f0; border-radius:.5rem; background:#fff; box-shadow:0 10px 24px rgba(15,23,42,.05); }
    .metric { border:1px solid #dbe3ef; border-radius:.5rem; background:#fff; padding:1rem; }
    .tab.active { background:#0f766e; color:#fff; border-color:#0f766e; }
    .chip { display:inline-flex; align-items:center; gap:.35rem; border-radius:999px; border:1px solid #cbd5e1; padding:.25rem .55rem; font-size:.72rem; font-weight:800; }
    .chip.ok { border-color:#86efac; background:#f0fdf4; color:#166534; }
    .chip.warn { border-color:#fbbf24; background:#fffbeb; color:#92400e; }
    .chip.danger { border-color:#fca5a5; background:#fef2f2; color:#991b1b; }
    .report { white-space:pre-wrap; font-family:ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size:.82rem; line-height:1.55; }
    .scrollbar-thin::-webkit-scrollbar { width:8px; height:8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; }
    @media print {
      .no-print { display:none !important; }
      body { background:#fff !important; }
      .print-clean { box-shadow:none !important; border:0 !important; }
    }
  </style>

    function uid(prefix = "id") {
      return `${prefix}-${Math.random().toString(36).slice(2, 9)}`;
    }

    function num(value, fallback = 0) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function inputValue(target) {
      if (target.type === "number") return target.value === "" ? "" : num(target.value);
      return target.value;
    }

    function ceil(value) {
      return Math.ceil(Math.max(0, num(value)));
    }

    function fmt(value, digits = 2) {
      return num(value).toLocaleString("en-MY", { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }

    function money(value) {
      return `RM ${fmt(value)}`;
    }

    function pct(value) {
      return `${fmt(value, 1)}%`;
    }

    function unitDay() {
      return state.language === "zh" ? "天" : "days";
    }

    function unitPiece() {
      return state.language === "zh" ? "片" : "pcs";
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, num(value)));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    let state = loadState();

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        return saved ? mergeState(structuredClone(defaultState), saved) : structuredClone(defaultState);
      } catch {
        return structuredClone(defaultState);
      }
    }

    function mergeState(base, saved) {
      for (const key of Object.keys(saved || {})) {
        if (saved[key] && typeof saved[key] === "object" && !Array.isArray(saved[key]) && base[key]) {
          base[key] = mergeState(base[key], saved[key]);
        } else {
          base[key] = saved[key];
        }
      }
      return base;
    }

    function saveState() {
      const copy = structuredClone(state);
      if (copy.uploadedPlan?.previewUrl?.startsWith("blob:")) copy.uploadedPlan.previewUrl = "";
      localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
    }

    function repairLegacyImportedRooms() {
      const warning = "AI did not return reliable room length/width. Please enter site-measured dimensions for skirting and layout waste.";
      (state.rooms || []).forEach(room => {
        const area = num(room.manualGrossArea);
        const length = num(room.length);
        const width = num(room.width);
        const side = Math.sqrt(Math.max(0.01, area));
        const looksLikeSquareFallback = area > 0 &&
          length > 0 &&
          width > 0 &&
          Math.abs(length - width) < 0.000001 &&
          Math.abs(length - side) < 0.0001 &&
          num(room.confidence, 100) < 100;
        if (!looksLikeSquareFallback) return;
        room.length = "";
        room.width = "";
        room.dimensionSource = "missing";
        if (room.shapeType !== "Rectangle") room.shapeType = "Manual Area";
        appendWarning(room, warning);
      });
    }

    function appendWarning(target, warning) {
      const existing = String(target.aiWarning || "");
      if (!existing.includes(warning)) target.aiWarning = existing ? `${existing} ${warning}` : warning;
    }

    /* =========================================================
       Room Calculation, Material Estimation
       ========================================================= */
    function tileById(id) {
      return state.tiles.find(tile => tile.id === id) || state.tiles[0];
    }

    function shapeArea(room) {
      const manualGrossArea = Math.max(0, num(room.manualGrossArea));
      if (manualGrossArea > 0) return manualGrossArea;
      const base = Math.max(0, num(room.length) * num(room.width));
      if (room.shapeType === "Column Cutout") return base;
      if (room.shapeType === "L-Shape") return Math.max(0, base * 0.82);
      if (room.shapeType === "U-Shape") return Math.max(0, base * 0.74);
      if (room.shapeType === "Polygon") return Math.max(0, base * 0.88);
      if (room.shapeType === "Hexagon") return Math.max(0, base * 0.78);
      if (room.shapeType === "Hollow Area") return Math.max(0, base * 0.70);
      return base;
    }

    function roomCalc(room) {
      const tile = tileById(room.tileSchemeId);
      const grossArea = shapeArea(room);
      const obstacleArea = (room.obstacles || []).reduce((sum, obs) => sum + Math.max(0, num(obs.area)), 0);
      const manualDeducted = Math.max(0, num(room.manualDeductedArea));
      const deductedArea = Math.min(grossArea, obstacleArea + manualDeducted);
      const netArea = Math.max(0, grossArea - deductedArea);

      const tileArea = Math.max(0.0001, num(tile.length) * num(tile.width));
      const areaPieces = Math.ceil(netArea / tileArea);

      const fullCols = Math.ceil(Math.max(0.01, num(room.width)) / Math.max(0.01, num(tile.width)));
      const fullRows = Math.ceil(Math.max(0.01, num(room.length)) / Math.max(0.01, num(tile.length)));
      const layoutPieces = Math.max(areaPieces, fullCols * fullRows);
      const edgeWastePieces = Math.max(0, layoutPieces - areaPieces);

      const perimeter = 2 * (Math.max(0, num(room.length)) + Math.max(0, num(room.width)));
      const skirtingStripLength = Math.max(0.01, num(tile.length));
      const skirtingPieces = Math.ceil(perimeter / skirtingStripLength);
      const stripsPerTile = Math.max(1, Math.floor(num(tile.width) / Math.max(0.01, num(state.settings.skirtingHeight))));
      const skirtingSourceTiles = Math.ceil(skirtingPieces / stripsPerTile);

      const wastePieces = Math.ceil(layoutPieces * Math.max(0, num(state.settings.wasteAllowance)) / 100);
      const totalPieces = layoutPieces + skirtingSourceTiles + wastePieces;
      const boxes = Math.ceil(totalPieces / Math.max(1, num(tile.piecesPerBox, 1)));
      const tileCost = boxes * num(tile.costPerBox);

      return {
        grossArea,
        deductedArea,
        netArea,
        areaPieces,
        layoutPieces,
        edgeWastePieces,
        skirtingPieces,
        skirtingSourceTiles,
        wastePieces,
        totalPieces,
        boxes,
        tileCost,
        perimeter
      };
    }

    function calculateTotals() {
      const roomRows = state.rooms.map(room => ({ room, calc: roomCalc(room) }));
      const netArea = roomRows.reduce((sum, item) => sum + item.calc.netArea, 0);
      const grossArea = roomRows.reduce((sum, item) => sum + item.calc.grossArea, 0);
      const deductedArea = roomRows.reduce((sum, item) => sum + item.calc.deductedArea, 0);
      const totalPieces = roomRows.reduce((sum, item) => sum + item.calc.totalPieces, 0);
      const layoutWastePieces = roomRows.reduce((sum, item) => sum + item.calc.edgeWastePieces + item.calc.wastePieces, 0);
      const boxes = roomRows.reduce((sum, item) => sum + item.calc.boxes, 0);
      const tileCost = roomRows.reduce((sum, item) => sum + item.calc.tileCost, 0);
      const skirtingPieces = roomRows.reduce((sum, item) => sum + item.calc.skirtingPieces, 0);
      const skirtingSourceTiles = roomRows.reduce((sum, item) => sum + item.calc.skirtingSourceTiles, 0);

      const adhesiveBags = Math.ceil(
        netArea / Math.max(0.01, num(state.settings.adhesiveCoverage, 7.43)) *
        Math.max(0.01, num(state.settings.thicknessFactor, 1)) *
        Math.max(0.01, num(state.settings.unevenFloorFactor, 1)) *
        Math.max(0.01, num(state.settings.susuFactor, 1))
      );
      const cementBags = Math.ceil(netArea * Math.max(0, num(state.settings.cementKgPerM2)) / Math.max(1, num(state.settings.cementBagKg, 50)));
      const sandM3 = netArea * Math.max(0, num(state.settings.sandM3PerM2));
      const adhesiveCost = adhesiveBags * Math.max(0, num(state.settings.adhesiveCostPerBag, 28));
      const cementCost = cementBags * Math.max(0, num(state.settings.cementCostPerBag, 18));
      const sandCost = sandM3 * Math.max(0, num(state.settings.sandCostPerM3, 95));
      const materialCost = tileCost + adhesiveCost + cementCost + sandCost;

      return {
        roomRows,
        grossArea,
        deductedArea,
        netArea,
        totalPieces,
        layoutWastePieces,
        boxes,
        tileCost,
        skirtingPieces,
        skirtingSourceTiles,
        adhesiveBags,
        cementBags,
        sandM3,
        adhesiveCost,
        cementCost,
        sandCost,
        materialCost
      };
    }

    /* =========================================================
       Duration Prediction, Weather Risk, Accuracy Evaluation
       ========================================================= */
    function calculateWeatherRisk() {
      const rainfallRisk = { None: 0, Light: 4, Moderate: 9, Heavy: 18 }[state.risk.rainfall] || 0;
      const typeRisk = { Indoor: 0, Mixed: 5, Outdoor: 12 }[state.risk.projectType] || 0;
      const humidityRisk = Math.max(0, num(state.risk.humidity) - 70) * 0.25;
      const heatRisk = Math.max(0, num(state.risk.temperature) - 32) * 0.7;
      const workerRisk = num(state.risk.workerAbsence) + num(state.risk.sickLeave) + num(state.risk.publicHoliday);
      const materialRisk = num(state.risk.materialShortage) + Math.max(0, 100 - num(state.risk.siteStockAvailability)) * 0.18;
      const equipmentRisk = num(state.risk.equipmentFailure);
      const overall = Math.min(100, rainfallRisk + typeRisk + humidityRisk + heatRisk + workerRisk + materialRisk + equipmentRisk);
      const level = overall >= 45 ? "High" : overall >= 22 ? "Medium" : "Low";
      return { rainfallRisk, typeRisk, humidityRisk, heatRisk, workerRisk, materialRisk, equipmentRisk, overall, level };
    }

    async function fetchLiveWeather() {
      if (state.liveWeather.status === "running") return;
      const location = (state.risk.weatherLocation || state.project.location || "").trim();
      if (!location) {
        toast(t("Enter project location before fetching weather."));
        return;
      }
      state.liveWeather.status = "running";
      state.liveWeather.error = "";
      render();
      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=en&format=json`;
        const geoResponse = await fetch(geoUrl);
        if (!geoResponse.ok) throw new Error(`Weather geocoding failed: ${geoResponse.status}`);
        const geoData = await geoResponse.json();
        const place = geoData.results?.[0];
        if (!place) throw new Error(`Location not found: ${location}`);

        const forecastUrl = new URL("https://api.open-meteo.com/v1/forecast");
        forecastUrl.search = new URLSearchParams({
          latitude: place.latitude,
          longitude: place.longitude,
          current: "temperature_2m,relative_humidity_2m,precipitation,rain",
          hourly: "temperature_2m,relative_humidity_2m,precipitation,precipitation_probability,rain",
          forecast_days: "3",
          timezone: "auto"
        }).toString();
        const weatherResponse = await fetch(forecastUrl);
        if (!weatherResponse.ok) throw new Error(`Weather API HTTP ${weatherResponse.status}`);
        const weatherData = await weatherResponse.json();
        const hourly = weatherData.hourly || {};
        const start = Math.max(0, (hourly.time || []).findIndex(time => new Date(time).getTime() >= Date.now()));
        const end = start + 24;
        const precipitation = (hourly.precipitation || []).slice(start, end).map(value => num(value));
        const probability = (hourly.precipitation_probability || []).slice(start, end).map(value => num(value));
        const humidity = (hourly.relative_humidity_2m || []).slice(start, end).map(value => num(value));
        const temperature = (hourly.temperature_2m || []).slice(start, end).map(value => num(value));
        const rainSum = precipitation.reduce((sum, value) => sum + value, 0);
        const maxProbability = probability.length ? Math.max(...probability) : 0;
        const avgHumidity = average(humidity, weatherData.current?.relative_humidity_2m);
        const avgTemperature = average(temperature, weatherData.current?.temperature_2m);

        state.risk.rainfall = rainfallLevelFromForecast(rainSum, maxProbability);
        state.risk.humidity = Math.round(avgHumidity);
        state.risk.temperature = Math.round(avgTemperature);
        state.risk.weatherLocation = `${place.name}${place.admin1 ? ", " + place.admin1 : ""}${place.country ? ", " + place.country : ""}`;
        state.liveWeather = {
          status: "completed",
          error: "",
          source: "Open-Meteo",
          updatedAt: new Date().toLocaleString(),
          locationLabel: state.risk.weatherLocation,
          latitude: place.latitude,
          longitude: place.longitude,
          currentTemperature: num(weatherData.current?.temperature_2m, avgTemperature),
          currentHumidity: num(weatherData.current?.relative_humidity_2m, avgHumidity),
          currentPrecipitation: num(weatherData.current?.precipitation, 0),
          next24hRain: rainSum,
          maxRainProbability: maxProbability
        };
        toast(t("Weather updated"));
      } catch (error) {
        state.liveWeather.status = "failed";
        state.liveWeather.error = error.message || String(error);
        toast(t("Weather fetch failed"));
      }
      render();
    }

    function average(values, fallback = 0) {
      const clean = values.filter(value => Number.isFinite(value));
      if (!clean.length) return num(fallback);
      return clean.reduce((sum, value) => sum + value, 0) / clean.length;
    }

    function rainfallLevelFromForecast(rainMm, probability) {
      if (rainMm >= 20 || probability >= 80) return "Heavy";
      if (rainMm >= 5 || probability >= 55) return "Moderate";
      if (rainMm > 0.3 || probability >= 25) return "Light";
      return "None";
    }

    function calculateDuration(totals = calculateTotals()) {
      const workers = Math.max(1, num(state.labour.workers, 2));
      const productivity = Math.max(0.01, num(state.labour.productivityPerWorker, 21.13));
      const dailyTeamProductivity = workers * productivity;
      const baseDuration = totals.netArea / dailyTeamProductivity;
      const risk = calculateWeatherRisk();
      const weatherFactor = Math.max(num(state.labour.weatherFactor, 1), 1 + risk.overall / 300);
      const adjustedDuration = baseDuration *
        Math.max(0.01, num(state.labour.complexityFactor, 1)) *
        weatherFactor *
        Math.max(0.01, num(state.labour.workerRiskFactor, 1)) *
        Math.max(0.01, num(state.labour.materialSupplyFactor, 1)) *
        Math.max(0.01, num(state.labour.equipmentFactor, 1));
      return { workers, productivity, dailyTeamProductivity, baseDuration, weatherFactor, adjustedDuration, risk };
    }

    function calculateAccuracy() {
      const a = state.accuracy;
      const materialError = estimated => num(a.actualMaterial) ? Math.abs(num(estimated) - num(a.actualMaterial)) / num(a.actualMaterial) * 100 : 0;
      const durationError = estimated => num(a.actualDuration) ? Math.abs(num(estimated) - num(a.actualDuration)) / num(a.actualDuration) * 100 : 0;
      const timeSaving = num(a.manualMinutes) ? Math.max(0, (num(a.manualMinutes) - num(a.aiMinutes)) / num(a.manualMinutes) * 100) : 0;
      return {
        aiMaterialError: materialError(a.aiMaterial),
        manualMaterialError: materialError(a.manualMaterial),
        aiDurationError: durationError(a.aiDuration),
        manualDurationError: durationError(a.manualDuration),
        timeSaving
      };
    }

    /* =========================================================
       Floor Plan Upload, Gemini Detection, Room Crop
       ========================================================= */
    function handleUpload(file) {
      if (!file) return;
      currentUploadedFile = file;
      if (state.uploadedPlan?.previewUrl?.startsWith("blob:")) URL.revokeObjectURL(state.uploadedPlan.previewUrl);
      const isImage = file.type.startsWith("image/");
      state.uploadedPlan = {
        name: file.name,
        type: file.type || "CAD exported image / unknown",
        size: file.size,
        previewUrl: isImage ? URL.createObjectURL(file) : "",
        isImage
      };
      state.aiResults = [];
      state.aiStatus = "idle";
      state.aiError = "";
      state.aiSummary = "";
      uploadedImageElement = null;
      if (isImage) {
        const image = new Image();
        image.onload = () => { uploadedImageElement = image; };
        image.src = state.uploadedPlan.previewUrl;
      }
      render();
    }

    function cropRoomImageFromPlan(imageElement, bbox) {
      if (!imageElement || !bbox) return "";
      const naturalWidth = imageElement.naturalWidth || imageElement.width;
      const naturalHeight = imageElement.naturalHeight || imageElement.height;
      if (!naturalWidth || !naturalHeight) return "";
      const ratioBox = bbox.unit === "ratio" || (bbox.x <= 1 && bbox.y <= 1 && bbox.width <= 1 && bbox.height <= 1);
      const sx = ratioBox ? clamp(bbox.x * naturalWidth, 0, naturalWidth - 1) : clamp(bbox.x, 0, naturalWidth - 1);
      const sy = ratioBox ? clamp(bbox.y * naturalHeight, 0, naturalHeight - 1) : clamp(bbox.y, 0, naturalHeight - 1);
      const sw = ratioBox ? clamp(bbox.width * naturalWidth, 1, naturalWidth - sx) : clamp(bbox.width, 1, naturalWidth - sx);
      const sh = ratioBox ? clamp(bbox.height * naturalHeight, 1, naturalHeight - sy) : clamp(bbox.height, 1, naturalHeight - sy);
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(sw));
      canvas.height = Math.max(1, Math.round(sh));
      const ctx = canvas.getContext("2d");
      ctx.drawImage(imageElement, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/png");
    }

    function apiEndpoint() {
      const configured = (state.api?.backendUrl || "").trim();
      if (configured) return configured;
      return location.protocol === "file:"
        ? "https://tilingai.tchong0712.workers.dev/api/analyze-floor-plan"
        : "/api/analyze-floor-plan";
    }

    async function analyzeFloorPlanWithGemini(file) {
      const form = new FormData();
      form.append("file", file, file.name);
      form.append("payload", JSON.stringify({
        language: state.language,
        project: state.project,
        settings: state.settings,
        labour: state.labour,
        risk: state.risk,
        rooms: state.rooms.map(room => ({
          roomName: room.roomName,
          roomType: room.roomType,
          shapeType: room.shapeType,
          grossArea: roomCalc(room).grossArea,
          netArea: roomCalc(room).netArea
        })),
        ai: {
          modelName: state.api?.modelName || ""
        }
      }));

      const response = await fetch(apiEndpoint(), { method: "POST", body: form });
      const text = await response.text();
      if (!response.ok) throw new Error(serverErrorMessage(text, response.status));
      try {
        return JSON.parse(text);
      } catch {
        throw new Error(text || `HTTP ${response.status}`);
      }
    }

    function serverErrorMessage(text, status) {
      try {
        const data = JSON.parse(text);
        return data.detail || data.error || data.message || `HTTP ${status}`;
      } catch {
        return text || `HTTP ${status}`;
      }
    }

    function normalizeAIResponse(data, image) {
      const sourceRooms = Array.isArray(data?.rooms) ? data.rooms : [];
      if (!sourceRooms.length) throw new Error(t("Server returned no room detection result."));
      state.aiSummary = data.summary || "";
      return sourceRooms.map((room, index) => normalizeAIRoom(room, index, image));
    }

    function normalizeAIRoom(room, index, image) {
      const grossArea = num(room.grossArea ?? room.gross_area_m2 ?? room.gross_area ?? room.area ?? room.netArea ?? room.net_area_m2);
      const deductedArea = num(room.deductedArea ?? room.deduction_area_m2 ?? room.deducted_area ?? room.deductionArea);
      const netArea = num(room.netArea ?? room.net_area_m2 ?? room.area, Math.max(0, grossArea - deductedArea));
      const confidenceRaw = num(room.confidence ?? room.confidence_score ?? room.confidenceScore, 0);
      const confidence = confidenceRaw <= 1 ? confidenceRaw * 100 : confidenceRaw;
      const bbox = normalizeBBox(room.bbox ?? room.boundingBox ?? room.bounding_box);
      const dimensions = inferRoomDimensions(room, grossArea, bbox, image);
      const obstacles = Array.isArray(room.obstacles) ? room.obstacles.map(normalizeAIObstacle) : [];
      const warnings = [
        ...(Array.isArray(room.warnings) ? room.warnings : []),
        room.aiWarning || room.ai_warning || room.warning || "",
        dimensions.source === "missing" ? "AI did not return reliable room length/width. Please enter site-measured dimensions for skirting and layout waste." : ""
      ].filter(Boolean);

      return {
        id: uid("ai"),
        roomName: room.roomName || room.room_name || room.name || `Room ${index + 1}`,
        roomType: normalizeRoomType(room.roomType || room.room_type || room.type),
        shapeType: normalizeShapeType(room.shapeType || room.shape || room.shape_type),
        grossArea,
        deductedArea,
        netArea,
        length: dimensions.length,
        width: dimensions.width,
        dimensionSource: dimensions.source,
        confidence: clamp(confidence, 0, 100),
        bbox,
        obstacles,
        aiWarning: warnings.join(" "),
        cropImage: image && bbox ? cropRoomImageFromPlan(image, bbox) : "",
        source: "Gemini"
      };
    }

    function inferRoomDimensions(room, area, bbox, image) {
      const explicitLength = num(room.length ?? room.roomLength ?? room.lengthM ?? room.length_m ?? room.dimensions?.length ?? room.dimensions?.lengthM);
      const explicitWidth = num(room.width ?? room.roomWidth ?? room.widthM ?? room.width_m ?? room.dimensions?.width ?? room.dimensions?.widthM);
      if (explicitLength > 0 && explicitWidth > 0) {
        return { length: explicitLength, width: explicitWidth, source: "explicit" };
      }

      const safeArea = Math.max(0.01, num(area, 1));
      const naturalWidth = image?.naturalWidth || image?.width || 1;
      const naturalHeight = image?.naturalHeight || image?.height || 1;
      const imageAspect = naturalWidth / Math.max(1, naturalHeight);
      if (bbox?.width > 0 && bbox?.height > 0) {
        const ratioBox = bbox.unit === "ratio" || (bbox.x <= 1 && bbox.y <= 1 && bbox.width <= 1 && bbox.height <= 1);
        const aspect = ratioBox ? (bbox.width * imageAspect) / bbox.height : bbox.width / bbox.height;
        if (Number.isFinite(aspect) && aspect > 0 && (aspect < 0.92 || aspect > 1.08)) {
          const length = Math.sqrt(safeArea / aspect);
          const width = safeArea / length;
          return { length, width, source: "bbox" };
        }
      }

      return { length: "", width: "", source: "missing" };
    }

    function normalizeAIObstacle(obstacle) {
      return {
        type: normalizeObstacleType(obstacle.type || obstacle.obstacleType || obstacle.name),
        area: num(obstacle.area ?? obstacle.area_m2 ?? obstacle.size, 0)
      };
    }

    function normalizeRoomType(value = "") {
      const text = String(value).toLowerCase();
      if (text.includes("living") || text.includes("dining") || text.includes("客")) return "Living Room";
      if (text.includes("bed") || text.includes("卧")) return "Bedroom";
      if (text.includes("kitchen") || text.includes("厨")) return "Kitchen";
      if (text.includes("bath") || text.includes("toilet") || text.includes("洗") || text.includes("浴")) return "Bathroom";
      if (text.includes("corridor") || text.includes("hall") || text.includes("走")) return "Corridor";
      if (text.includes("balcony") || text.includes("阳")) return "Balcony";
      if (text.includes("office") || text.includes("办")) return "Office";
      return roomTypes.includes(value) ? value : "Other";
    }

    function normalizeShapeType(value = "") {
      const text = String(value).toLowerCase();
      if (text.includes("u")) return "U-Shape";
      if (text.includes("l")) return "L-Shape";
      if (text.includes("hex")) return "Hexagon";
      if (text.includes("hollow") || text.includes("void")) return "Hollow Area";
      if (text.includes("column")) return "Column Cutout";
      if (text.includes("poly") || text.includes("irregular")) return "Polygon";
      if (text.includes("manual")) return "Manual Area";
      return shapeTypes.includes(value) ? value : "Rectangle";
    }

    function normalizeObstacleType(value = "") {
      const text = String(value).toLowerCase();
      if (text.includes("column") || text.includes("柱")) return "Column";
      if (text.includes("void") || text.includes("open")) return "Void Area";
      if (text.includes("stair")) return "Staircase";
      if (text.includes("cabinet")) return "Fixed Cabinet";
      if (text.includes("island")) return "Island Counter";
      return obstacleTypes.includes(value) ? value : "Other Obstacle";
    }

    function normalizeBBox(bbox) {
      if (!bbox) return null;
      const x = num(bbox.x ?? bbox.left ?? bbox.x1);
      const y = num(bbox.y ?? bbox.top ?? bbox.y1);
      const width = num(bbox.width ?? bbox.w ?? ((bbox.x2 ?? bbox.right) - x));
      const height = num(bbox.height ?? bbox.h ?? ((bbox.y2 ?? bbox.bottom) - y));
      if (width <= 0 || height <= 0) return null;
      return { x, y, width, height, unit: bbox.unit || bbox.units || "ratio" };
    }

    async function runAIDetection() {
      if (state.aiStatus === "running") return;
      if (!state.uploadedPlan) {
        toast(t("Please upload a JPG/PNG/PDF or CAD exported image first."));
        state.activePage = "upload";
        render();
        return;
      }
      if (!currentUploadedFile) {
        toast(t("Please upload the drawing again before running Gemini. Browser security does not keep the file object after refresh."));
        state.activePage = "upload";
        render();
        return;
      }
      state.aiStatus = "running";
      state.aiError = "";
      state.aiSummary = t("Calling Gemini through Cloudflare Worker...");
      render();
      try {
        let image = uploadedImageElement;
        if (!image && state.uploadedPlan.previewUrl) {
          image = await loadImage(state.uploadedPlan.previewUrl).catch(() => null);
          uploadedImageElement = image;
        }
        const data = await analyzeFloorPlanWithGemini(currentUploadedFile);
        state.aiResults = normalizeAIResponse(data, image);
        state.aiStatus = "completed";
        state.aiError = "";
        state.activePage = "ai";
        toast(t("Gemini detection completed."));
      } catch (error) {
        state.aiResults = [];
        state.aiStatus = "failed";
        state.aiError = error.message || String(error);
        state.aiSummary = "";
        state.activePage = "ai";
        toast(t("Gemini analysis failed."));
      }
      render();
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    /* =========================================================
       Import AI Result, Validation
       ========================================================= */
    function importAIResults() {
      if (!state.aiResults.length) return;
      const firstTile = state.tiles[0]?.id || "";
      const imported = state.aiResults.map(result => {
        const dimensions = inferRoomDimensions(result, result.grossArea, result.bbox, uploadedImageElement);
        const shapeType = dimensions.source === "missing" && result.shapeType !== "Rectangle" ? "Manual Area" : result.shapeType;
        return {
          id: uid("room"),
          roomName: result.roomName.replace(/^Detected\s+/i, ""),
          roomType: result.roomType,
          shapeType,
          length: dimensions.length,
          width: dimensions.width,
          manualGrossArea: result.grossArea,
          manualDeductedArea: Math.max(0, result.deductedArea - (result.obstacles || []).reduce((sum, obs) => sum + num(obs.area), 0)),
          tileSchemeId: firstTile,
          confidence: result.confidence,
          bbox: result.bbox,
          cropImage: result.cropImage,
          dimensionSource: dimensions.source,
          aiWarning: result.aiWarning,
          obstacles: (result.obstacles || []).map(obs => ({ id: uid("obs"), type: obs.type, area: obs.area }))
        };
      });
      state.rooms.push(...imported);
      state.activePage = "rooms";
      toast(t("AI result imported. You can manually correct rooms now."));
      render();
    }

    function validationWarnings() {
      const warnings = [];
      state.rooms.forEach(room => {
        const calc = roomCalc(room);
        if (num(room.confidence, 100) < 80) warnings.push(`${room.roomName}: ${state.language === "zh" ? "AI 置信度低于 80%，需要人工复核。" : "AI confidence below 80%; manual review required."}`);
        if (calc.deductedArea > calc.grossArea * 0.25) warnings.push(`${room.roomName}: ${state.language === "zh" ? "扣除面积比例偏高，请确认柱位/空洞。" : "deducted area is high; verify columns/voids."}`);
        if (calc.edgeWastePieces > calc.areaPieces * 0.18) warnings.push(`${room.roomName}: ${state.language === "zh" ? "边缘排版损耗偏高，建议复核砖规格或排版。" : "edge layout waste is high; review tile size/layout."}`);
      });
      if (!state.rooms.length) warnings.push(state.language === "zh" ? "尚未输入房间。" : "No rooms entered.");
      return warnings;
    }

    /* =========================================================
       Report Generation, WhatsApp Summary
       ========================================================= */
    function optimizationSuggestions() {
      const totals = calculateTotals();
      const duration = calculateDuration(totals);
      const accuracy = calculateAccuracy();
      const suggestions = [];
      if (totals.layoutWastePieces > totals.totalPieces * 0.12) suggestions.push(state.language === "zh" ? "边缘排版损耗偏高，可尝试更换瓷砖尺寸或调整起铺线。" : "Edge/layout waste is high; consider changing tile size or setting-out line.");
      if (totals.adhesiveBags > Math.ceil(totals.netArea / state.settings.adhesiveCoverage) * 1.2) suggestions.push(state.language === "zh" ? "瓷砖胶包数偏高，主要受厚度/地面不平整系数影响。" : "Adhesive quantity is high, mainly driven by thickness/uneven-floor factors.");
      if (duration.risk.level !== "Low") suggestions.push(state.language === "zh" ? "天气或供应风险明显，建议增加缓冲天数并提前进料。" : "Weather or supply risk is material; add buffer days and procure earlier.");
      if (accuracy.aiMaterialError > accuracy.manualMaterialError) suggestions.push(state.language === "zh" ? "当前 AI 材料误差高于人工方法，应强调人工复核层。" : "AI material error exceeds manual method; emphasize human review layer.");
      if (!suggestions.length) suggestions.push(state.language === "zh" ? "当前输入较稳定，但最终采购前仍需现场复核尺寸。" : "Inputs look stable, but site dimensions should still be verified before procurement.");
      return suggestions;
    }

    /* =========================================================
       UI Components
       ========================================================= */
    function input(label, path, type = "text", step = "") {
      return `<label><span class="field-label">${t(label)}</span><input class="field" type="${type}" ${step ? `step="${step}"` : ""} data-bind="${path}" value="${escapeHtml(getPath(path))}"></label>`;
    }

    function select(label, path, options) {
      const value = getPath(path);
      return `<label><span class="field-label">${t(label)}</span><select class="select" data-bind="${path}">${options.map(option => `<option value="${escapeHtml(option)}" ${option === value ? "selected" : ""}>${t(option)}</option>`).join("")}</select></label>`;
    }

    function textarea(label, path, rows = 3) {
      return `<label><span class="field-label">${t(label)}</span><textarea class="textarea" rows="${rows}" data-bind="${path}">${escapeHtml(getPath(path))}</textarea></label>`;
    }

    function getPath(path) {
      return path.split(".").reduce((obj, key) => obj?.[key], state);
    }

    function setPath(path, value) {
      const keys = path.split(".");
      let target = state;
      while (keys.length > 1) target = target[keys.shift()];
      target[keys[0]] = value;
    }

    function metric(label, value, tone = "slate") {
      const color = tone === "green" ? "text-emerald-700" : tone === "amber" ? "text-amber-700" : tone === "red" ? "text-red-700" : "text-slate-950";
      return `<div class="metric"><p class="text-xs font-extrabold uppercase text-slate-500">${t(label)}</p><p class="mt-2 text-xl font-black ${color}">${value}</p></div>`;
    }

    function confidenceChip(value) {
      const tone = value >= 85 ? "ok" : value >= 70 ? "warn" : "danger";
      return `<span class="chip ${tone}">${pct(value)}</span>`;
    }

                ${roomTileSelect(room)}
                ${roomField(room, "Length (m)", "length", "number", "0.01")}
                ${roomField(room, "Width (m)", "width", "number", "0.01")}
                ${roomField(room, "Manual gross area (m²)", "manualGrossArea", "number", "0.01")}
                ${roomField(room, "Manual deducted area (m²)", "manualDeductedArea", "number", "0.01")}
              </div>
              ${room.aiWarning ? `<p class="mt-3 rounded-lg bg-amber-50 p-2 text-xs font-bold text-amber-800">${escapeHtml(t(room.aiWarning))}</p>` : ""}
              <div class="mt-4 rounded-lg bg-slate-50 p-3">
                <div class="grid gap-2 text-sm md:grid-cols-4">
                  <div><span class="font-bold text-slate-500">${t("Gross Area")}</span><strong class="block">${fmt(calc.grossArea)} m²</strong></div>
                  <div><span class="font-bold text-slate-500">${t("Deducted Area")}</span><strong class="block">${fmt(calc.deductedArea)} m²</strong></div>
                  <div><span class="font-bold text-slate-500">${t("Net Tile Area")}</span><strong class="block">${fmt(calc.netArea)} m²</strong></div>
                  <div><span class="font-bold text-slate-500">${t("Tile Boxes")}</span><strong class="block">${fmt(calc.boxes, 0)}</strong></div>
                </div>
              </div>
              <div class="mt-4">
                <div class="mb-2 flex items-center justify-between"><h4 class="text-sm font-black">${t("Obstacles")}</h4><button class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-black" data-action="add-obstacle" data-room="${room.id}">${t("Add obstacle")}</button></div>
                <div class="grid gap-2">${(room.obstacles || []).map(obs => renderObstacle(room, obs)).join("") || `<p class="text-sm font-bold text-slate-400">${t("None")}</p>`}</div>
              </div>
            </div>
          </div>
        </article>`;
    }

    function roomField(room, label, field, type = "text", step = "") {
      return `<label><span class="field-label">${t(label)}</span><input class="field" type="${type}" ${step ? `step="${step}"` : ""} data-room="${room.id}" data-room-field="${field}" value="${escapeHtml(room[field])}"></label>`;
    }

    function roomSelect(room, label, field, options) {
      return `<label><span class="field-label">${t(label)}</span><select class="select" data-room="${room.id}" data-room-field="${field}">${options.map(option => `<option value="${escapeHtml(option)}" ${option === room[field] ? "selected" : ""}>${t(option)}</option>`).join("")}</select></label>`;
    }

    function roomTileSelect(room) {
      return `<label><span class="field-label">${t("Tile Scheme")}</span><select class="select" data-room="${room.id}" data-room-field="tileSchemeId">${state.tiles.map(tile => `<option value="${tile.id}" ${tile.id === room.tileSchemeId ? "selected" : ""}>${escapeHtml(tile.name)}</option>`).join("")}</select></label>`;
    }

    function renderObstacle(room, obs) {
      return `<div class="grid gap-2 rounded-lg border border-slate-200 bg-white p-2 md:grid-cols-[1fr_1fr_auto]">
        <label><span class="field-label">${t("Obstacle Type")}</span><select class="select" data-obstacle="${obs.id}" data-room="${room.id}" data-obstacle-field="type">${obstacleTypes.map(type => `<option value="${type}" ${type === obs.type ? "selected" : ""}>${t(type)}</option>`).join("")}</select></label>
        <label><span class="field-label">${t("Obstacle area (m²)")}</span><input class="field" type="number" step="0.01" data-obstacle="${obs.id}" data-room="${room.id}" data-obstacle-field="area" value="${escapeHtml(obs.area)}"></label>
        <button class="self-end rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-black text-red-700" data-action="delete-obstacle" data-room="${room.id}" data-obstacle="${obs.id}">${t("Delete")}</button>
      </div>`;
    }

    function renderSettings() {
      const totals = calculateTotals();
      return `
        <section class="grid gap-4 lg:grid-cols-[1fr_22rem]">
          <div class="grid gap-4">
            <div class="panel p-4">
              <div class="flex items-center justify-between"><h2 class="text-lg font-black">${t("Tile schemes")}</h2><button class="rounded-lg bg-teal-700 px-4 py-2 text-sm font-black text-white" data-action="add-tile">${t("Add tile scheme")}</button></div>
              <div class="mt-3 overflow-x-auto"><table class="w-full min-w-[720px] text-sm"><thead><tr class="bg-slate-100 text-left text-xs uppercase text-slate-500"><th class="p-2">${t("Tile name")}</th><th>${t("Tile length (m)")}</th><th>${t("Tile width (m)")}</th><th>${t("Pieces per box")}</th><th>${t("Cost per box (RM)")}</th><th></th></tr></thead><tbody>${state.tiles.map(renderTileRow).join("")}</tbody></table></div>
            </div>
            <div class="panel p-4">
              <h2 class="text-lg font-black">${t("Interview-based material settings")}</h2>
              <p class="mt-1 text-sm font-semibold text-slate-500">${t("Interview adhesive note")}</p>
              <div class="mt-3 grid gap-3 md:grid-cols-4">
                ${input("Waste allowance (%)", "settings.wasteAllowance", "number", "1")}
                ${input("Adhesive coverage / 50kg bag (m²)", "settings.adhesiveCoverage", "number", "0.01")}
                ${input("Thickness factor", "settings.thicknessFactor", "number", "0.01")}
                ${input("Uneven floor factor", "settings.unevenFloorFactor", "number", "0.01")}
                ${input("Cement kg per m²", "settings.cementKgPerM2", "number", "0.01")}
                ${input("Sand m³ per m²", "settings.sandM3PerM2", "number", "0.001")}
                ${input("Adhesive cost per 50kg bag (RM)", "settings.adhesiveCostPerBag", "number", "0.01")}
                ${input("Cement cost per 50kg bag (RM)", "settings.cementCostPerBag", "number", "0.01")}
                ${input("Sand cost per m³ (RM)", "settings.sandCostPerM3", "number", "0.01")}
                ${input("Susu / adhesive factor", "settings.susuFactor", "number", "0.01")}
                ${input("Skirting height (m)", "settings.skirtingHeight", "number", "0.01")}
              </div>
            </div>
          </div>
          <aside class="panel p-4">
            <h3 class="font-black">${t("Material output")}</h3>
            <div class="mt-3 space-y-2 text-sm">
              ${summaryLine("Tile Boxes", fmt(totals.boxes, 0))}
              ${summaryLine("Adhesive Bags", `${totals.adhesiveBags} × 50kg`)}
              ${summaryLine("Cement Bags", `${totals.cementBags} × 50kg`)}
              ${summaryLine("Sand Volume", `${fmt(totals.sandM3, 2)} m³`)}
              ${summaryLine("Skirting Source Tiles", fmt(totals.skirtingSourceTiles, 0))}
              ${summaryLine("Edge/Layout Waste", `${fmt(totals.layoutWastePieces, 0)} ${unitPiece()}`)}
              ${summaryLine("Material Cost", money(totals.materialCost))}
            </div>
          </aside>
        </section>`;
    }

    function renderTileRow(tile) {
      return `<tr class="border-b">
        <td class="p-2"><input class="field" data-tile="${tile.id}" data-tile-field="name" value="${escapeHtml(tile.name)}"></td>
        <td class="p-2"><input class="field" type="number" step="0.01" data-tile="${tile.id}" data-tile-field="length" value="${tile.length}"></td>
        <td class="p-2"><input class="field" type="number" step="0.01" data-tile="${tile.id}" data-tile-field="width" value="${tile.width}"></td>
        <td class="p-2"><input class="field" type="number" step="1" data-tile="${tile.id}" data-tile-field="piecesPerBox" value="${tile.piecesPerBox}"></td>
        <td class="p-2"><input class="field" type="number" step="0.01" data-tile="${tile.id}" data-tile-field="costPerBox" value="${tile.costPerBox}"></td>
        <td class="p-2"><button class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs font-black text-red-700" data-action="delete-tile" data-tile="${tile.id}">${t("Delete")}</button></td>
      </tr>`;
    }

    function summaryLine(label, value) {
      return `<div class="flex justify-between gap-4 border-b pb-2"><span class="font-bold text-slate-500">${t(label)}</span><strong>${value}</strong></div>`;
    }

    function renderDuration() {
      const duration = calculateDuration();
      return `
        <section class="grid gap-4 lg:grid-cols-[1fr_22rem]">
          <div class="panel p-4">
            <h2 class="text-lg font-black">${t("Labour & Duration")}</h2>
            <p class="mt-1 text-sm font-semibold text-slate-500">${t("Interview duration note")}</p>
            <div class="mt-3 grid gap-3 md:grid-cols-3">
              ${input("Workers", "labour.workers", "number", "1")}
              ${input("Productivity per worker per day (m²)", "labour.productivityPerWorker", "number", "0.01")}
              ${input("Complexity factor", "labour.complexityFactor", "number", "0.01")}
              ${input("Weather factor", "labour.weatherFactor", "number", "0.01")}
              ${input("Worker risk factor", "labour.workerRiskFactor", "number", "0.01")}
              ${input("Material supply factor", "labour.materialSupplyFactor", "number", "0.01")}
              ${input("Equipment factor", "labour.equipmentFactor", "number", "0.01")}
            </div>
          </div>
          <aside class="panel p-4">
            <h3 class="font-black">${t("Duration Prediction")}</h3>
            <div class="mt-3 space-y-2 text-sm">
              ${summaryLine("Daily Team Productivity", `${fmt(duration.dailyTeamProductivity)} m²/day`)}
              ${summaryLine("Base Duration", `${fmt(duration.baseDuration, 1)} ${unitDay()}`)}
              ${summaryLine("Weather factor", fmt(duration.weatherFactor, 2))}
              ${summaryLine("Adjusted Duration", `${fmt(duration.adjustedDuration, 1)} ${unitDay()}`)}
            </div>
          </aside>
        </section>`;
    }

    function renderRisk() {
      const risk = calculateWeatherRisk();
      const weather = state.liveWeather || {};
      const weatherRunning = weather.status === "running";
      return `
        <section class="grid gap-4 lg:grid-cols-[1fr_22rem]">
          <div class="panel p-4">
            <h2 class="text-lg font-black">${t("Weather & Risk")}</h2>
            <p class="mt-1 text-sm font-semibold text-slate-500">${t("Live weather data is used to update rainfall, humidity and temperature before duration risk is calculated.")}</p>
            <div class="mt-3 grid gap-3 md:grid-cols-3">
              ${input("Weather search location", "risk.weatherLocation")}
              ${select("Project Type", "risk.projectType", ["Indoor", "Outdoor", "Mixed"])}
              ${select("Rainfall", "risk.rainfall", ["None", "Light", "Moderate", "Heavy"])}
              ${input("Humidity (%)", "risk.humidity", "number", "1")}
              ${input("Temperature (°C)", "risk.temperature", "number", "1")}
              ${input("Worker Absence (%)", "risk.workerAbsence", "number", "1")}
              ${input("Sick Leave (%)", "risk.sickLeave", "number", "1")}
              ${input("Public Holiday (%)", "risk.publicHoliday", "number", "1")}
              ${input("Material Shortage (%)", "risk.materialShortage", "number", "1")}
              ${input("Site Stock Availability (%)", "risk.siteStockAvailability", "number", "1")}
              ${input("Equipment Failure (%)", "risk.equipmentFailure", "number", "1")}
            </div>
            <button class="mt-4 rounded-lg bg-teal-700 px-4 py-3 text-sm font-black text-white ${weatherRunning ? "opacity-60" : ""}" data-action="fetch-weather">${weatherRunning ? t("Fetching live weather...") : t("Fetch live weather")}</button>
            ${weather.status === "completed" ? `<div class="mt-4 grid gap-2 rounded-lg border border-teal-200 bg-teal-50 p-3 text-sm font-bold text-teal-900 md:grid-cols-2">
              <div>${t("Live Weather Source")}: ${escapeHtml(weather.source)}</div>
              <div>${t("Last weather update")}: ${escapeHtml(weather.updatedAt)}</div>
              <div>${t("Location")}: ${escapeHtml(weather.locationLabel)}</div>
              <div>${t("Temperature (°C)")}: ${fmt(weather.currentTemperature, 1)}</div>
              <div>${t("Humidity (%)")}: ${fmt(weather.currentHumidity, 0)}</div>
              <div>${t("Next 24h rain")}: ${fmt(weather.next24hRain, 1)} mm</div>
              <div>${t("Rain probability")}: ${fmt(weather.maxRainProbability, 0)}%</div>
              <div>${t("Rainfall")}: ${t(state.risk.rainfall)}</div>
            </div>` : ""}
            ${weather.status === "failed" ? `<div class="mt-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm font-bold text-red-800">${t("Weather fetch failed")}: ${escapeHtml(weather.error)}</div>` : ""}
          </div>
          <aside class="panel p-4">
            <h3 class="font-black">${t("Risk Analysis")}</h3>
            <div class="mt-3 space-y-2 text-sm">
              ${summaryLine("Weather Impact", pct(risk.rainfallRisk + risk.typeRisk + risk.humidityRisk + risk.heatRisk))}
              ${summaryLine("Worker risk factor", pct(risk.workerRisk))}
              ${summaryLine("Material supply factor", pct(risk.materialRisk))}
              ${summaryLine("Equipment factor", pct(risk.equipmentRisk))}
              ${summaryLine("Overall Delay Risk", pct(risk.overall))}
              ${summaryLine("Risk Level", t(risk.level))}
            </div>
          </aside>
        </section>`;
    }

    function renderAccuracy() {
      const result = calculateAccuracy();
      return `
        <section class="grid gap-4 lg:grid-cols-[1fr_22rem]">
          <div class="panel p-4">
            <h2 class="text-lg font-black">${t("Accuracy Evaluation")}</h2>
            <div class="mt-3 grid gap-3 md:grid-cols-3">
              ${input("AI estimated material cost", "accuracy.aiMaterial", "number", "0.01")}
              ${input("Manual estimated material cost", "accuracy.manualMaterial", "number", "0.01")}
              ${input("Actual material cost", "accuracy.actualMaterial", "number", "0.01")}
              ${input("AI estimated duration", "accuracy.aiDuration", "number", "0.1")}
              ${input("Manual estimated duration", "accuracy.manualDuration", "number", "0.1")}
              ${input("Actual duration", "accuracy.actualDuration", "number", "0.1")}
              ${input("AI calculation time (min)", "accuracy.aiMinutes", "number", "0.1")}
              ${input("Manual calculation time (min)", "accuracy.manualMinutes", "number", "0.1")}
            </div>
          </div>
          <aside class="panel p-4">
            <h3 class="font-black">${t("Accuracy Evaluation")}</h3>
            <div class="mt-3 space-y-2 text-sm">
              ${summaryLine(`AI ${t("Material Error Rate")}`, pct(result.aiMaterialError))}
              ${summaryLine(`${t("Manual")} ${t("Material Error Rate")}`, pct(result.manualMaterialError))}
              ${summaryLine(`AI ${t("Duration Error Rate")}`, pct(result.aiDurationError))}
              ${summaryLine(`${t("Manual")} ${t("Duration Error Rate")}`, pct(result.manualDurationError))}
              ${summaryLine("Time Saving", pct(result.timeSaving))}
            </div>
          </aside>
        </section>`;
    }

    function renderReport() {
      const report = generateReport();
      return `
        <section class="grid gap-4 lg:grid-cols-[1fr_22rem]">
          <div class="panel print-clean p-4">
            <h2 class="text-lg font-black">${t("Final Report")}</h2>
            <div class="report mt-4 rounded-lg bg-slate-50 p-4">${escapeHtml(report)}</div>
          </div>
          <aside class="panel no-print p-4">
            <h3 class="font-black">${t("Copy to WhatsApp")}</h3>
            <button class="mt-3 w-full rounded-lg bg-green-700 px-4 py-3 text-sm font-black text-white" data-action="copy-whatsapp">${t("Copy to WhatsApp")}</button>
            <button class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm font-black text-slate-700" data-action="copy-summary">${t("Copy Summary")}</button>
            <button class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm font-black text-slate-700" data-action="download-report">${t("Download Report")}</button>
            <button class="mt-2 w-full rounded-lg bg-slate-950 px-4 py-3 text-sm font-black text-white" data-action="print">${t("Print")}</button>
          </aside>
        </section>`;
    }

    /* =========================================================
       Event Handling
       ========================================================= */
    document.addEventListener("click", event => {
      const page = event.target.closest("[data-page]");
      if (page) {
        state.activePage = page.dataset.page;
        render();
        return;
      }
      const action = event.target.closest("[data-action]");
      if (!action) return;
      const name = action.dataset.action;
      if (name === "run-ai") return runAIDetection();
      if (name === "fetch-weather") return fetchLiveWeather();
      if (name === "import-ai") return importAIResults();
      if (name === "add-room") state.rooms.push(defaultRoom(`Room ${state.rooms.length + 1}`, "Other", "Rectangle", 3, 3, state.tiles[0]?.id || ""));
      if (name === "delete-room") state.rooms = state.rooms.filter(room => room.id !== action.dataset.room);
      if (name === "add-obstacle") {
        const room = state.rooms.find(item => item.id === action.dataset.room);
        if (room) room.obstacles.push({ id: uid("obs"), type: "Column", area: 0.25 });
      }
      if (name === "delete-obstacle") {
        const room = state.rooms.find(item => item.id === action.dataset.room);
        if (room) room.obstacles = room.obstacles.filter(obs => obs.id !== action.dataset.obstacle);
      }
      if (name === "add-tile") state.tiles.push({ id: uid("tile"), name: `Tile Scheme ${state.tiles.length + 1}`, length: 0.6, width: 0.6, piecesPerBox: 4, costPerBox: 50 });
      if (name === "delete-tile" && state.tiles.length > 1) {
        state.tiles = state.tiles.filter(tile => tile.id !== action.dataset.tile);
        state.rooms.forEach(room => { if (room.tileSchemeId === action.dataset.tile) room.tileSchemeId = state.tiles[0].id; });
      }
      if (name === "copy-whatsapp") return copyText(whatsappSummary(), t("Copied. Paste into WhatsApp."));
      if (name === "copy-summary") return copyText(generateReport(), t("Summary copied."));
      if (name === "download-report") return downloadReport();
      if (name === "print") return window.print();
      render();
    });

    document.addEventListener("input", event => {
      const target = event.target;
      if (target.matches("[data-bind]")) setPath(target.dataset.bind, inputValue(target));
      if (target.matches("[data-room-field]")) {
        const room = state.rooms.find(item => item.id === target.dataset.room);
        if (room) room[target.dataset.roomField] = inputValue(target);
      }
      if (target.matches("[data-obstacle-field]")) {
        const room = state.rooms.find(item => item.id === target.dataset.room);
        const obs = room?.obstacles.find(item => item.id === target.dataset.obstacle);
        if (obs) obs[target.dataset.obstacleField] = inputValue(target);
      }
      if (target.matches("[data-tile-field]")) {
        const tile = state.tiles.find(item => item.id === target.dataset.tile);
        if (tile) tile[target.dataset.tileField] = inputValue(target);
      }
      saveState();
    });

    document.addEventListener("change", event => {
      const target = event.target;
      if (target.id === "languageSwitch") {
        state.language = target.value;
        render();
        return;
      }
      if (target.id === "planFile") {
        handleUpload(target.files[0]);
        return;
      }
      if (target.matches("[data-bind], [data-room-field], [data-obstacle-field], [data-tile-field]")) render();
    });

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        toast(message);
      } catch {
        toast(text.slice(0, 160));
      }
    }

    function downloadReport() {
      const blob = new Blob([generateReport()], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "tiling-ai-final-report.txt";
      link.click();
      URL.revokeObjectURL(url);
    }

    function toast(message) {
      document.querySelector(".toast")?.remove();
      const node = document.createElement("div");
      node.className = "toast no-print fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-lg bg-slate-950 px-4 py-3 text-sm font-black text-white shadow-xl";
      node.textContent = message;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 1900);
    }

    render();
  </script>
</body>
</html>
