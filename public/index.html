<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-Assisted Tile Estimation Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --surface: #ffffff;
      --surface-2: #eef3ef;
      --ink: #172026;
      --muted: #62707a;
      --line: #d8ded7;
      --accent: #0f766e;
      --accent-2: #b45309;
      --danger: #b91c1c;
      --ok: #166534;
      --shadow: 0 14px 32px rgba(23, 32, 38, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fbfcf8;
      padding: 18px;
    }

    .brand {
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 22px;
      line-height: 1.15;
    }

    h2 {
      margin-bottom: 8px;
      font-size: 24px;
      line-height: 1.2;
    }

    h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .nav {
      display: grid;
      gap: 6px;
      margin-top: 20px;
    }

    .nav-group-label {
      margin: 14px 4px 2px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .nav-group-label:first-child {
      margin-top: 0;
    }

    .nav button {
      display: grid;
      grid-template-columns: 26px 1fr;
      align-items: center;
      min-height: 42px;
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      text-align: left;
    }

    .nav button.active {
      border-color: #9fd3cc;
      background: #e5f4f1;
      color: #0b4f49;
      font-weight: 800;
    }

    .nav-icon {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
    }

    .main {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 247, 242, 0.94);
      backdrop-filter: blur(10px);
      padding: 14px 22px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 68px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 10px 12px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 18px;
      line-height: 1.2;
    }

    .metric.accent strong {
      color: var(--accent);
    }

    .metric.warn strong {
      color: var(--accent-2);
    }

    .content {
      padding: 24px;
    }

    .view-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid #b9c7c0;
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 12px;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .btn.warn {
      border-color: #d58b3d;
      background: #fff7ed;
      color: #8a3d06;
    }

    .btn.danger {
      border-color: #efb0b0;
      background: #fff4f4;
      color: var(--danger);
    }

    .btn.ghost {
      background: transparent;
    }

    .icon-btn {
      width: 36px;
      min-width: 36px;
      padding: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }

    .panel,
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 16px;
    }

    .card {
      padding: 14px;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    label {
      display: grid;
      gap: 6px;
      color: #30404a;
      font-size: 12px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid #bdc8c2;
      border-radius: var(--radius);
      background: white;
      color: var(--ink);
      padding: 8px 10px;
      outline: none;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
    }

    input[type="checkbox"] {
      min-height: auto;
      width: 18px;
      height: 18px;
    }

    input[type="range"] {
      padding: 0;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      color: var(--ink);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    table {
      width: 100%;
      min-width: 480px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-2);
      color: #31434c;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .room-list {
      display: grid;
      gap: 12px;
    }

    .room-card {
      display: grid;
      gap: 12px;
    }

    .room-card header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .room-total {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      padding: 4px 8px;
      color: #34444d;
      font-size: 12px;
      font-weight: 800;
    }

    .tag.ok {
      border-color: #a7d6b4;
      background: #effaf1;
      color: var(--ok);
    }

    .tag.warn {
      border-color: #e8bc80;
      background: #fff8ec;
      color: #8a3d06;
    }

    .tag.danger {
      border-color: #ebb2b2;
      background: #fff4f4;
      color: var(--danger);
    }

    .canvas-box {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcf8;
    }

    canvas {
      display: block;
      width: 100%;
      height: 330px;
    }

    .plan-preview {
      display: grid;
      min-height: 260px;
      place-items: center;
      overflow: hidden;
      border: 1px dashed #a9b8b1;
      border-radius: var(--radius);
      background: #fbfcf8;
    }

    .plan-preview img {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
    }

    .assumption-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .assumption-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .assumption-list li:last-child {
      border-bottom: 0;
    }

    .assumption-list strong {
      color: var(--ink);
      white-space: nowrap;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .flow-step {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 12px;
    }

    .flow-step strong {
      display: block;
      margin-bottom: 6px;
      color: var(--accent);
      font-size: 13px;
    }

    .flow-step span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .report {
      white-space: pre-wrap;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcf8;
      padding: 16px;
      color: #26343b;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    /* Raw Gemini summary: capped + scrollable so it never dominates small screens. */
    .raw-output {
      white-space: pre-wrap;
      max-height: 280px;
      overflow: auto;
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcf8;
      padding: 12px;
      color: #26343b;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    details.advanced > summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--accent);
      list-style: none;
    }

    details.advanced > summary::-webkit-details-marker { display: none; }

    details.advanced > summary::before {
      content: "▸ ";
    }

    details.advanced[open] > summary::before {
      content: "▾ ";
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 30;
      transform: translateX(-50%);
      border-radius: var(--radius);
      background: #172026;
      color: white;
      padding: 10px 14px;
      box-shadow: var(--shadow);
      font-weight: 800;
    }

    .empty {
      display: grid;
      min-height: 180px;
      place-items: center;
      border: 1px dashed #a9b8b1;
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .notice {
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 14px;
      border: 1px solid var(--line);
      background: #fbfcf8;
    }

    .notice.warn {
      border-color: #e6c66a;
      background: #fdf6e3;
      color: #6b5612;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      /* Compact horizontal-scrolling tab bar instead of a tall stacked menu. */
      .nav {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 8px;
        margin-top: 12px;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }

      .nav button {
        width: auto;
        white-space: nowrap;
        min-height: 38px;
      }

      .nav-group-label {
        display: none;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .flow {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .topbar,
      .content {
        padding: 14px;
      }

      .summary,
      .grid.two,
      .grid.three,
      .grid.four,
      .flow {
        grid-template-columns: 1fr;
      }

      .view-head,
      .room-card header,
      .section-title {
        align-items: stretch;
        flex-direction: column;
      }

      canvas {
        height: 280px;
      }
    }

    @media print {
      .sidebar,
      .topbar,
      .actions,
      .no-print {
        display: none !important;
      }

      .shell {
        display: block;
      }

      .content {
        padding: 0;
      }

      .panel,
      .card,
      .report {
        box-shadow: none;
      }
    }
  </style>
</head>

    function uid(prefix) {
      return `${prefix}-${Math.random().toString(36).slice(2, 9)}`;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return structuredClone(defaultState);
        return mergeState(structuredClone(defaultState), saved);
      } catch {
        return structuredClone(defaultState);
      }
    }

    function mergeState(base, saved) {
      for (const key of Object.keys(saved || {})) {
        if (saved[key] && typeof saved[key] === "object" && !Array.isArray(saved[key])) {
          base[key] = mergeState(base[key] || {}, saved[key]);
        } else {
          base[key] = saved[key];
        }
      }
      return base;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function h(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function t(text) {
      return i18n[state.language]?.[text] || text;
    }

    function statusText(message) {
      const value = String(message || "");
      const separator = value.indexOf(": ");
      if (separator < 0) return t(value);
      return `${t(value.slice(0, separator))}: ${value.slice(separator + 2)}`;
    }

    function toNumber(value, fallback = 0) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function fmt(value, digits = 2) {
      return toNumber(value).toLocaleString("en-MY", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function money(value) {
      return `RM ${fmt(value)}`;
    }

    function percent(value) {
      return `${fmt(value, 1)}%`;
    }

    function getPath(path) {
      return path.split(".").reduce((obj, key) => obj?.[key], state);
    }

    function setPath(path, value) {
      const parts = path.split(".");
      let cursor = state;
      while (parts.length > 1) cursor = cursor[parts.shift()];
      cursor[parts[0]] = value;
    }

    function tileById(id) {
      return state.tiles.find(item => item.id === id) || state.tiles[0];
    }

    function roomGrossArea(item) {
      if (item.shape === "manual") return Math.max(0, toNumber(item.manualArea));
      const base = Math.max(0, toNumber(item.length) * toNumber(item.width));
      if (item.shape === "l-shape") {
        return Math.max(0, base - Math.max(0, toNumber(item.cutLength) * toNumber(item.cutWidth)));
      }
      return base;
    }

    function roomPerimeter(item) {
      if (toNumber(item.perimeter) > 0) return toNumber(item.perimeter);
      const length = Math.max(0, toNumber(item.length));
      const width = Math.max(0, toNumber(item.width));
      if (!length || !width) return 0;
      if (item.shape === "l-shape") return 2 * (length + width);
      return 2 * (length + width);
    }

    function roomCalc(item) {
      const gross = roomGrossArea(item);
      const deduction = Math.min(gross, Math.max(0, toNumber(item.obstacleArea)));
      const floorArea = Math.max(0, gross - deduction);
      const skirtingLength = item.skirting ? roomPerimeter(item) : 0;
      const skirtingArea = skirtingLength * Math.max(0, toNumber(state.settings.skirtingHeight));
      const tileArea = floorArea + skirtingArea;
      const tileItem = tileById(item.tileId);
      const eachTileArea = Math.max(0.0001, toNumber(tileItem?.length) * toNumber(tileItem?.width));
      const areaWithWaste = tileArea * (1 + Math.max(0, toNumber(state.settings.wastePercent)) / 100);
      const pieces = Math.ceil(areaWithWaste / eachTileArea);
      const boxes = Math.ceil(pieces / Math.max(1, toNumber(tileItem?.piecesPerBox, 1)));
      const tileCost = boxes * Math.max(0, toNumber(tileItem?.costPerBox));
      return { gross, deduction, floorArea, skirtingLength, skirtingArea, tileArea, areaWithWaste, pieces, boxes, tileCost };
    }

    function calculateTotals() {
      const rooms = state.rooms.map(item => ({ room: item, calc: roomCalc(item) }));
      const floorArea = rooms.reduce((sum, item) => sum + item.calc.floorArea, 0);
      const tileArea = rooms.reduce((sum, item) => sum + item.calc.tileArea, 0);
      const areaWithWaste = rooms.reduce((sum, item) => sum + item.calc.areaWithWaste, 0);
      const tilePieces = rooms.reduce((sum, item) => sum + item.calc.pieces, 0);
      const tileBoxes = rooms.reduce((sum, item) => sum + item.calc.boxes, 0);
      const tileCost = rooms.reduce((sum, item) => sum + item.calc.tileCost, 0);
      const skirtingLength = rooms.reduce((sum, item) => sum + item.calc.skirtingLength, 0);
      const adhesiveBags = Math.ceil((areaWithWaste / Math.max(0.01, toNumber(state.settings.adhesiveCoveragePerBag))) * Math.max(0, toNumber(state.settings.thicknessFactor, 1)));
      const adhesiveCost = adhesiveBags * Math.max(0, toNumber(state.settings.adhesiveCostPerBag));
      const groutKg = Math.ceil(tileArea * Math.max(0, toNumber(state.settings.groutKgPerM2)) * 10) / 10;
      const groutCost = groutKg * Math.max(0, toNumber(state.settings.groutCostPerKg));
      const cementBags = Math.ceil(floorArea * Math.max(0, toNumber(state.settings.cementBagPerM2)));
      const cementCost = cementBags * Math.max(0, toNumber(state.settings.cementCostPerBag));
      const sandM3 = floorArea * Math.max(0, toNumber(state.settings.sandM3PerM2));
      const sandCost = sandM3 * Math.max(0, toNumber(state.settings.sandCostPerM3));
      const materialCost = tileCost + adhesiveCost + groutCost + cementCost + sandCost;
      return {
        rooms,
        roomCount: state.rooms.length,
        floorArea,
        tileArea,
        areaWithWaste,
        tilePieces,
        tileBoxes,
        tileCost,
        skirtingLength,
        adhesiveBags,
        adhesiveCost,
        groutKg,
        groutCost,
        cementBags,
        cementCost,
        sandM3,
        sandCost,
        materialCost
      };
    }

    function calculateSchedule(totals) {
      const workers = Math.max(1, toNumber(state.schedule.workers, 1));
      const productivity = Math.max(0.1, toNumber(state.schedule.productivityPerWorker, 1));
      const dailyOutput = workers * productivity;
      const baseDays = totals.floorArea / dailyOutput;
      const riskPercent = (
        toNumber(state.schedule.weatherDelayPercent) * 0.35 +
        toNumber(state.schedule.workerAbsencePercent) * 0.25 +
        toNumber(state.schedule.materialRiskPercent) * 0.25 +
        toNumber(state.schedule.equipmentRiskPercent) * 0.15 +
        realWorldRiskPercent() +
        liveWeatherRiskPercent()
      );
      const adjustedDays = baseDays * Math.max(0.1, toNumber(state.schedule.complexityFactor, 1)) * (1 + riskPercent / 100);
      const bufferDays = adjustedDays * Math.max(0, toNumber(state.schedule.bufferPercent)) / 100;
      const finalDays = adjustedDays + bufferDays + Math.max(0, toNumber(state.schedule.publicHolidayDays));
      const targetDays = Math.max(1, toNumber(state.schedule.targetDays, 1));
      const recommendedWorkers = Math.max(1, Math.ceil(totals.floorArea / (targetDays * productivity)));
      const level = riskPercent >= 35 ? "High" : riskPercent >= 16 ? "Medium" : "Low";
      return { dailyOutput, baseDays, riskPercent, adjustedDays, bufferDays, finalDays, recommendedWorkers, level };
    }

    function liveWeatherRiskPercent() {
      if (!state.weather.enabled || !state.weather.current) return 0;
      let risk = 0;
      const exposure = state.site.workExposure || "Mixed indoor/outdoor";
      const exposureFactor = exposure.includes("Outdoor") ? 1.35 : exposure.includes("Mixed") ? 0.85 : 0.28;
      const current = state.weather.current;
      if (toNumber(current.precipitation) > 0 || rainCode(current.weather_code)) risk += 8;
      if (toNumber(current.relative_humidity_2m) >= 88) risk += 4;
      if (toNumber(current.temperature_2m) >= 34) risk += 3;
      if (toNumber(current.wind_speed_10m) >= 28 || toNumber(current.wind_gusts_10m) >= 38) risk += 4;

      const dailyRisk = state.weather.daily.slice(0, 4).reduce((sum, day) => {
        let score = 0;
        if (toNumber(day.precipitation_sum) >= 10) score += 7;
        else if (toNumber(day.precipitation_sum) >= 3) score += 4;
        if (toNumber(day.precipitation_probability_max) >= 75) score += 5;
        else if (toNumber(day.precipitation_probability_max) >= 50) score += 3;
        if (toNumber(day.wind_speed_10m_max) >= 30) score += 3;
        if (toNumber(day.temperature_2m_max) >= 35) score += 2;
        return sum + score;
      }, 0) / Math.max(1, Math.min(4, state.weather.daily.length || 1));

      return Math.min(35, (risk + dailyRisk) * exposureFactor);
    }

    function rainCode(code) {
      return [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(Number(code));
    }

    function weatherCodeText(code) {
      const map = {
        0: "Clear",
        1: "Mainly clear",
        2: "Partly cloudy",
        3: "Overcast",
        45: "Fog",
        48: "Depositing rime fog",
        51: "Light drizzle",
        53: "Drizzle",
        55: "Dense drizzle",
        61: "Slight rain",
        63: "Rain",
        65: "Heavy rain",
        80: "Rain showers",
        81: "Rain showers",
        82: "Violent rain showers",
        95: "Thunderstorm",
        96: "Thunderstorm with hail",
        99: "Thunderstorm with hail"
      };
      return map[Number(code)] || "Weather data";
    }

    function workabilityLevel() {
      const risk = liveWeatherRiskPercent();
      if (risk >= 18) return "Stop outdoor work";
      if (risk >= 8) return "Caution";
      return "Good";
    }

    function realWorldRiskPercent() {
      let risk = 0;
      if (state.site.scaleReliability === "Low") risk += 4;
      if (state.site.drawingQuality.includes("Poor")) risk += 4;
      if (state.site.substrateLevelness === "Uneven") risk += 5;
      if (state.site.tilePattern === "Diagonal layout") risk += 3;
      if (state.site.tilePattern === "Intricate / mixed pattern") risk += 6;
      if (state.site.accessConstraint.includes("Occupied")) risk += 3;
      if (state.site.wetArea.includes("Mixed")) risk += 2;
      return risk;
    }

    function recommendedWastePercent() {
      let waste = state.site.tilePattern === "Intricate / mixed pattern" ? 20 : state.site.tilePattern === "Diagonal layout" ? 15 : 10;
      if (state.site.substrateLevelness === "Uneven") waste += 3;
      if (state.site.scaleReliability === "Low") waste += 2;
      if (state.site.drawingQuality.includes("Poor")) waste += 3;
      if (state.site.accessConstraint.includes("Occupied")) waste += 2;
      return waste;
    }

    async function refreshWeather() {
      const query = (state.weather.locationQuery || state.project.location || "").trim();
      if (!query) {
        state.weather.status = "Location required";
        state.weather.error = "Enter a city, district, or project location first.";
        render();
        return;
      }

      state.weather.status = "Loading";
      state.weather.error = "";
      render();

      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
        const geoResponse = await fetch(geoUrl);
        if (!geoResponse.ok) throw new Error(`Geocoding failed (${geoResponse.status})`);
        const geo = await geoResponse.json();
        const place = geo.results?.[0];
        if (!place) throw new Error("Location not found");

        const forecastUrl = new URL("https://api.open-meteo.com/v1/forecast");
        forecastUrl.searchParams.set("latitude", place.latitude);
        forecastUrl.searchParams.set("longitude", place.longitude);
        forecastUrl.searchParams.set("current", "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,rain,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m");
        forecastUrl.searchParams.set("daily", "weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max");
        forecastUrl.searchParams.set("forecast_days", "7");
        forecastUrl.searchParams.set("timezone", "auto");

        const forecastResponse = await fetch(forecastUrl);
        if (!forecastResponse.ok) throw new Error(`Forecast failed (${forecastResponse.status})`);
        const forecast = await forecastResponse.json();

        state.weather.resolvedName = [place.name, place.admin1, place.country].filter(Boolean).join(", ");
        state.weather.latitude = place.latitude;
        state.weather.longitude = place.longitude;
        state.weather.current = forecast.current || null;
        state.weather.daily = normalizeDailyForecast(forecast.daily || {});
        state.weather.lastUpdated = new Date().toISOString();
        state.weather.status = "Live";
        state.weather.aiNote = buildWeatherAiNote();
        toast(t("Live weather") + " OK");
      } catch (error) {
        state.weather.status = "Error";
        state.weather.error = error.message || "Weather request failed";
        state.weather.aiNote = "Weather data could not be refreshed. Keep manual weather delay or try another location.";
      }
      render();
    }

    function normalizeDailyForecast(daily) {
      const days = daily.time || [];
      return days.map((time, index) => ({
        time,
        weather_code: daily.weather_code?.[index],
        temperature_2m_max: daily.temperature_2m_max?.[index],
        temperature_2m_min: daily.temperature_2m_min?.[index],
        precipitation_sum: daily.precipitation_sum?.[index],
        precipitation_probability_max: daily.precipitation_probability_max?.[index],
        wind_speed_10m_max: daily.wind_speed_10m_max?.[index]
      }));
    }

    function buildWeatherAiNote() {
      const level = workabilityLevel();
      const risk = liveWeatherRiskPercent();
      if (level === "Stop outdoor work") {
        return "AI adjustment: outdoor tiling should be postponed or moved indoors because live forecast indicates high rain/wind risk.";
      }
      if (level === "Caution") {
        return `AI adjustment: add schedule buffer because live weather adds ${percent(risk)} risk. Prioritize indoor work, surface preparation, procurement, or grouting checks.`;
      }
      return "AI adjustment: weather is acceptable for the selected work exposure. Keep normal buffer and monitor forecast before site work.";
    }

    function calculateEvaluation(totals, schedule) {
      const e = state.evaluation;
      const materialBase = Math.max(0.01, toNumber(e.actualMaterialCost));
      const durationBase = Math.max(0.01, toNumber(e.actualDuration));
      const aiMaterialError = Math.abs(toNumber(e.aiMaterialCost) - materialBase) / materialBase * 100;
      const manualMaterialError = Math.abs(toNumber(e.manualMaterialCost) - materialBase) / materialBase * 100;
      const aiDurationError = Math.abs(toNumber(e.aiDuration) - durationBase) / durationBase * 100;
      const manualDurationError = Math.abs(toNumber(e.manualDuration) - durationBase) / durationBase * 100;
      const timeSaving = toNumber(e.manualCalculationMinutes) > 0
        ? Math.max(0, (toNumber(e.manualCalculationMinutes) - toNumber(e.aiCalculationMinutes)) / toNumber(e.manualCalculationMinutes) * 100)
        : 0;
      const modelMaterialError = materialBase > 0 ? Math.abs(totals.materialCost - materialBase) / materialBase * 100 : 0;
      const modelDurationError = durationBase > 0 ? Math.abs(schedule.finalDays - durationBase) / durationBase * 100 : 0;
      return { aiMaterialError, manualMaterialError, aiDurationError, manualDurationError, timeSaving, modelMaterialError, modelDurationError };
    }

    function runSimulation() {
      const n = Math.max(1, Math.round(toNumber(state.simulation.sampleProjects, 1)));
      const rows = [];
      for (let index = 0; index < n; index++) {
        const aiMaterial = simulatedError(state.simulation.aiMaterialErrorMean);
        const manualMaterial = simulatedError(state.simulation.manualMaterialErrorMean);
        const aiDuration = simulatedError(state.simulation.aiDurationErrorMean);
        const manualDuration = simulatedError(state.simulation.manualDurationErrorMean);
        const aiMinutes = simulatedPositive(state.simulation.aiMinutesMean);
        const manualMinutes = simulatedPositive(state.simulation.manualMinutesMean);
        rows.push({ aiMaterial, manualMaterial, aiDuration, manualDuration, aiMinutes, manualMinutes });
      }

      const aiMaterialErrorMean = average(rows.map(row => row.aiMaterial));
      const manualMaterialErrorMean = average(rows.map(row => row.manualMaterial));
      const aiDurationErrorMean = average(rows.map(row => row.aiDuration));
      const manualDurationErrorMean = average(rows.map(row => row.manualDuration));
      const aiMinutesMean = average(rows.map(row => row.aiMinutes));
      const manualMinutesMean = average(rows.map(row => row.manualMinutes));
      const timeSavingMean = manualMinutesMean > 0 ? Math.max(0, (manualMinutesMean - aiMinutesMean) / manualMinutesMean * 100) : 0;
      const aiWinRateMaterial = Math.round(rows.filter(row => row.aiMaterial <= row.manualMaterial).length / n * 100);
      const aiWinRateDuration = Math.round(rows.filter(row => row.aiDuration <= row.manualDuration).length / n * 100);

      state.simulation.lastRun = {
        date: new Date().toISOString(),
        sampleProjects: n,
        aiMaterialErrorMean,
        manualMaterialErrorMean,
        aiDurationErrorMean,
        manualDurationErrorMean,
        aiMinutesMean,
        manualMinutesMean,
        timeSavingMean,
        aiWinRateMaterial,
        aiWinRateDuration
      };
      toast(t("Simulation completed"));
    }

    function simulatedError(mean) {
      const base = Math.max(0, toNumber(mean));
      const spread = Math.max(1.5, base * 0.35);
      const value = base + (Math.random() - 0.5) * 2 * spread;
      return Math.max(0, value);
    }

    function simulatedPositive(mean) {
      const base = Math.max(0.1, toNumber(mean, 1));
      const spread = Math.max(0.5, base * 0.25);
      return Math.max(0.1, base + (Math.random() - 0.5) * 2 * spread);
    }

    function average(values) {
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
    }

    function simulationNarrative(result) {
      if (state.language === "zh") {
        return `合成模拟摘要

样本项目数量：${result.sampleProjects}
AI 辅助材料误差：${percent(result.aiMaterialErrorMean)}
传统方法材料误差：${percent(result.manualMaterialErrorMean)}
AI 辅助工期误差：${percent(result.aiDurationErrorMean)}
传统方法工期误差：${percent(result.manualDurationErrorMean)}
AI 计算时间：${fmt(result.aiMinutesMean, 1)} 分钟
传统方法计算时间：${fmt(result.manualMinutesMean, 1)} 分钟
预计节省时间：${percent(result.timeSavingMean)}
AI 在 ${result.aiWinRateMaterial}% 的合成案例中材料准确率更好。
AI 在 ${result.aiWinRateDuration}% 的合成案例中工期准确率更好。

解释
这不是最终研究证据，而是用于规划 Python 大量模拟的前期实验。它帮助你定义样本数量、假设范围、误差指标和比较方法。`;
      }
      return `Synthetic Simulation Summary

Sample projects: ${result.sampleProjects}
AI-assisted material error: ${percent(result.aiMaterialErrorMean)}
Conventional material error: ${percent(result.manualMaterialErrorMean)}
AI-assisted duration error: ${percent(result.aiDurationErrorMean)}
Conventional duration error: ${percent(result.manualDurationErrorMean)}
AI calculation time: ${fmt(result.aiMinutesMean, 1)} minutes
Conventional calculation time: ${fmt(result.manualMinutesMean, 1)} minutes
Estimated time saving: ${percent(result.timeSavingMean)}
AI wins material accuracy in ${result.aiWinRateMaterial}% of synthetic cases.
AI wins duration accuracy in ${result.aiWinRateDuration}% of synthetic cases.

Interpretation
This is not final evidence. It is a planning simulation that helps define the assumptions, sample size, and expected comparison metrics before the Python-based experiment is written.`;
    }

    function input(label, path, type = "text", step = "") {
      const value = getPath(path);
      const stepAttr = step ? ` step="${h(step)}"` : "";
      return `
        <label>${t(label)}
          <input type="${type}" data-bind="${path}" value="${h(value)}"${stepAttr}>
        </label>
      `;
    }

    function selectInput(label, path, options) {
      const value = getPath(path);
      return `
        <label>${t(label)}
          <select data-bind="${path}">
            ${options.map(option => `<option value="${h(option)}" ${value === option ? "selected" : ""}>${h(t(option))}</option>`).join("")}
          </select>
        </label>
      `;
    }

    function textInput(label, path, rows = 4) {
      return `
        <label>${t(label)}
          <textarea rows="${rows}" data-bind="${path}">${h(getPath(path))}</textarea>
        </label>
      `;
    }

    function roomInput(item, label, field, type = "text", step = "") {
      const stepAttr = step ? ` step="${h(step)}"` : "";
      return `
        <label>${t(label)}
          <input type="${type}" data-room="${item.id}" data-room-field="${field}" value="${h(item[field])}"${stepAttr}>
        </label>
      `;
    }

    function roomSelect(item, label, field, options) {
      return `
        <label>${t(label)}
          <select data-room="${item.id}" data-room-field="${field}">
            ${options.map(([value, text]) => `<option value="${h(value)}" ${item[field] === value ? "selected" : ""}>${h(t(text))}</option>`).join("")}
          </select>
        </label>
      `;
    }

    function updateBoundInput(target) {
      if (target.dataset.bind) {
        const current = getPath(target.dataset.bind);
        const value = target.type === "checkbox" ? target.checked : target.type === "number" ? toNumber(target.value) : target.value;
        setPath(target.dataset.bind, value);
      }

      if (target.dataset.room) {
        const item = state.rooms.find(room => room.id === target.dataset.room);
        if (item) {
          const field = target.dataset.roomField;
          item[field] = target.type === "checkbox" ? target.checked : target.type === "number" ? toNumber(target.value) : target.value;
        }
      }

      if (target.dataset.tile) {
        const item = state.tiles.find(tile => tile.id === target.dataset.tile);
        if (item) {
          const field = target.dataset.tileField;
          item[field] = target.type === "number" ? toNumber(target.value) : target.value;
        }
      }

      saveState();
      renderSummary();
      requestAnimationFrame(drawPlan);
    }

    function handleAction(target) {
      const action = target.dataset.action;
      if (action === "view") {
        state.activeView = target.dataset.view;
      }
      if (action === "reset-demo") {
        localStorage.removeItem(STORAGE_KEY);
        state = structuredClone(defaultState);
        state.language = "zh";
        currentUploadedFile = null;
        render();
        toast(t("Chinese demo reset"));
        return;
      }
      if (action === "add-room") {
        state.rooms.push(room(state.language === "zh" ? `房间 ${state.rooms.length + 1}` : `Room ${state.rooms.length + 1}`, "Other", "rectangle", 3, 3, 0, 0, 0, state.tiles[0]?.id || "", true));
        toast(t("Room added"));
      }
      if (action === "duplicate-room") {
        const source = state.rooms.find(item => item.id === target.dataset.room);
        if (source) state.rooms.push({ ...structuredClone(source), id: uid("room"), name: `${source.name} ${state.language === "zh" ? "副本" : "copy"}` });
      }
      if (action === "delete-room") {
        state.rooms = state.rooms.filter(item => item.id !== target.dataset.room);
      }
      if (action === "add-tile") {
        const id = uid("tile");
        state.tiles.push(tile(id, state.language === "zh" ? `瓷砖方案 ${state.tiles.length + 1}` : `Tile scheme ${state.tiles.length + 1}`, 0.6, 0.6, 4, 50));
      }
      if (action === "delete-tile") {
        if (state.tiles.length > 1) {
          const id = target.dataset.tile;
          state.tiles = state.tiles.filter(item => item.id !== id);
          state.rooms.forEach(item => {
            if (item.tileId === id) item.tileId = state.tiles[0].id;
          });
        }
      }
      if (action === "mock-ai") {
        runMockAi();
      }
      if (action === "analyze-gemini") {
        analyzeWithGemini();
        return;
      }
      if (action === "import-ai") {
        importAiDraft();
      }
      if (action === "refresh-weather") {
        refreshWeather();
        return;
      }
      if (action === "run-simulation") {
        runSimulation();
      }
      if (action === "export-simulation") {
        exportSimulation();
        return;
      }
      if (action === "copy-report") {
        copyReport();
        return;
      }
      if (action === "download-report") {
        downloadReport();
        return;
      }
      if (action === "print") {
        window.print();
        return;
      }
      render();
    }

    function runMockAi() {
      state.plan.aiStatus = "Gemini extraction simulated";

      state.plan.aiDraft = [
        { name: state.language === "zh" ? "识别客厅" : "Detected Living", roomType: "Living", shape: "rectangle", area: 20.8, confidence: Math.max(50, 88 - qualityPenalty) },
        { name: state.language === "zh" ? "识别卧室" : "Detected Bedroom", roomType: "Bedroom", shape: "rectangle", area: 12.9, confidence: Math.max(50, 84 - qualityPenalty) },
        { name: state.language === "zh" ? "识别厨房" : "Detected Kitchen", roomType: "Kitchen", shape: "l-shape", area: 11.6, confidence: Math.max(50, 76 - qualityPenalty) }
      ];
      state.ai.outputSummary = state.language === "zh"
        ? "模拟 AI 从图纸中识别出三个房间。厨房置信度低于复核阈值，承包商需要在最终订料前确认尺寸。"
        : "Simulated AI extracted three rooms from the drawing. Kitchen confidence is below the review threshold, so the contractor should validate dimensions before final material ordering.";
      state.ai.lastRawResponse = state.ai.outputSummary;
      const needsReview = createRoomsFromDraft(state.plan.aiDraft);
      state.plan.lastImportedCount = state.plan.aiDraft.length;
      state.plan.aiDraft = [];
      state.activeView = "rooms";
      toast(needsReview
        ? (state.language === "zh" ? `演示已生成房间，其中 ${needsReview} 个待复核` : `Demo rooms created; ${needsReview} need review`)
        : t("Gemini-style draft created"));
    }

    async function analyzeWithGemini() {
      if (!currentUploadedFile) {
        state.ai.analysisStatus = "Upload a drawing file first";
        state.activeView = "project";
        render();
        toast(t(state.ai.analysisStatus));
        return;
      }

      const endpoint = (state.ai.backendUrl || "").trim() || (location.protocol === "file:" ? "" : "/api/analyze");
      if (!endpoint) {
        state.ai.analysisStatus = "Missing online backend. file:// cannot securely call Gemini. Deploy using DEPLOY.md first.";
        render();
        toast(t("Deploy backend first"));
        return;
      }

      state.plan.aiStatus = "Calling Gemini...";
      state.ai.analysisStatus = state.plan.aiStatus;
      render();

      try {
        const form = new FormData();
        form.append("file", currentUploadedFile, currentUploadedFile.name);
        form.append("payload", JSON.stringify({
          language: state.language,
          project: state.project,
          site: state.site,
          weather: {
            enabled: state.weather.enabled,
            current: state.weather.current,
            daily: state.weather.daily
          },
          settings: state.settings,
          schedule: state.schedule,
          ai: {
            modelName: state.ai.modelName,

          },
          prompt: {
            drawing: state.ai.drawingPrompt,
            estimation: state.ai.estimationPrompt,
            workflow: state.ai.workflowPrompt
          }
        }));

        const response = await fetch(endpoint, { method: "POST", body: form });
        const text = await response.text();
        if (!response.ok) throw new Error(text || `HTTP ${response.status}`);
        const data = JSON.parse(text);
        const rooms = Array.isArray(data.rooms) ? data.rooms : [];
        if (!rooms.length) throw new Error(t("Gemini returned no rooms"));

        state.plan.aiDraft = rooms.map((item, index) => ({
          name: item.name || item.room_name || `AI Room ${index + 1}`,
          roomType: item.roomType || item.room_type || "Other",
          shape: normalizeAiShape(item.shape),
          area: toNumber(item.area ?? item.gross_area_m2 ?? item.net_area_m2, 0),
          confidence: normalizeConfidence(item.confidence ?? item.confidence_score ?? 0.7),
          warning: Array.isArray(item.warnings) ? item.warnings.join("; ") : (item.warning || "")
        }));
        state.plan.aiStatus = "Gemini analysis complete, waiting for review";
        state.ai.analysisStatus = state.plan.aiStatus;
        state.ai.lastRawResponse = data.summary || data.workflow_notes?.join("\n") || text.slice(0, 1800);
        state.ai.outputSummary = data.summary || "";
        // Auto-create rooms and jump straight to the review page.
        const needsReview = createRoomsFromDraft(state.plan.aiDraft);
        state.plan.lastImportedCount = state.plan.aiDraft.length;
        state.plan.aiDraft = [];

    function normalizeAiShape(shape) {
      const value = String(shape || "").toLowerCase();
      if (value.includes("l")) return "l-shape";
      if (value.includes("manual") || value.includes("irregular") || value.includes("polygon")) return "manual";
      return "rectangle";
    }

    function normalizeConfidence(value) {
      const number = toNumber(value, 0);
      return number <= 1 ? number * 100 : number;
    }

    // Convert AI draft rows into editable rooms.
    // We keep the AI-reported AREA exact (shape "manual" + manualArea) instead of
    // faking length/width, and estimate an editable perimeter so skirting still works.
    // Returns the number of low-confidence rooms that need review.
    function createRoomsFromDraft(draft) {
      let needsReviewCount = 0;
      draft.forEach(item => {
        const area = Math.max(0, toNumber(item.area));
        const below = toNumber(item.confidence) < toNumber(state.ai.confidenceThreshold);
        if (below) needsReviewCount += 1;
        state.rooms.push({
          id: uid("room"),
          name: item.name,
          roomType: item.roomType,
          shape: "manual",
          length: 0,
          width: 0,
          cutLength: 0,
          cutWidth: 0,
          manualArea: Number(area.toFixed(2)),
          perimeter: area > 0 ? Number((4 * Math.sqrt(area)).toFixed(2)) : 0,
          obstacleArea: 0,
          tileId: state.tiles[0]?.id || "",
          skirting: true,
          aiConfidence: toNumber(item.confidence),
          needsReview: below,
          aiWarning: item.warning || ""
        });
      });
      return needsReviewCount;
    }

      if (!state.plan.aiDraft.length) return;
      const needsReview = createRoomsFromDraft(state.plan.aiDraft);

    function classifyInputFile(file) {

    function drawPlan() {
      const canvas = document.getElementById("planCanvas");
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(260, Math.floor(rect.height));
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#fbfcf8";
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = "#d8ded7";
      ctx.lineWidth = 1;
      for (let x = 0; x <= width; x += 24) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += 24) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      const colors = ["#bfe3dc", "#f4d6ab", "#cad8b8", "#d8c3b1", "#c9d6e4", "#e6c9c9"];
      let x = 18;
      let y = 18;
      let rowHeight = 0;
      const scale = Math.max(24, Math.min(48, width / 14));

      state.rooms.forEach((item, index) => {
        const calc = roomCalc(item);
        const roomWidth = Math.max(54, Math.min(width - 36, toNumber(item.width, 2.8) * scale));
        const roomHeight = Math.max(46, Math.min(160, toNumber(item.length, 3) * scale));
        if (x + roomWidth + 18 > width) {
          x = 18;
          y += rowHeight + 18;
          rowHeight = 0;
        }
        if (y + roomHeight + 18 > height) return;

        ctx.fillStyle = colors[index % colors.length];
        ctx.strokeStyle = "#172026";
        ctx.lineWidth = 1.5;
        ctx.fillRect(x, y, roomWidth, roomHeight);
        ctx.strokeRect(x, y, roomWidth, roomHeight);

        if (item.shape === "l-shape") {
          const cutW = Math.min(roomWidth * 0.38, Math.max(18, toNumber(item.cutWidth, 0.8) * scale));
          const cutH = Math.min(roomHeight * 0.38, Math.max(18, toNumber(item.cutLength, 1) * scale));
          ctx.fillStyle = "#fbfcf8";
          ctx.fillRect(x + roomWidth - cutW, y + roomHeight - cutH, cutW, cutH);
          ctx.strokeRect(x + roomWidth - cutW, y + roomHeight - cutH, cutW, cutH);
        }

        if (toNumber(item.obstacleArea) > 0) {
          const obstacle = Math.max(10, Math.min(28, Math.sqrt(toNumber(item.obstacleArea)) * scale * 0.5));
          ctx.fillStyle = "#8a3d06";
          ctx.fillRect(x + roomWidth - obstacle - 8, y + 8, obstacle, obstacle);
        }

        ctx.fillStyle = "#172026";
        ctx.font = "700 12px Inter, Arial";
        ctx.fillText(item.name || `Room ${index + 1}`, x + 8, y + 19);
        ctx.font = "12px Inter, Arial";
        ctx.fillText(`${fmt(calc.floorArea, 1)} m2`, x + 8, y + 37);

        x += roomWidth + 18;
        rowHeight = Math.max(rowHeight, roomHeight);
      });

      if (!state.rooms.length) {
        ctx.fillStyle = "#62707a";
        ctx.font = "700 14px Inter, Arial";
        ctx.textAlign = "center";
        ctx.fillText(t("Add rooms to generate a diagram preview."), width / 2, height / 2);
        ctx.textAlign = "start";
      }
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (target) handleAction(target);
    });

    document.addEventListener("input", event => {
      const target = event.target;
      if (target.matches("[data-bind], [data-room], [data-tile]")) updateBoundInput(target);
    });

    document.addEventListener("change", event => {
      const target = event.target;
      if (target.id === "languageSelect") {
        state.language = target.value;
        localizeDefaultData(state.language);
        render();
        return;
      }
      if (target.id === "planFile") {
        handleFile(target.files[0]);
        return;
      }
      if (target.matches("[data-bind], [data-room], [data-tile]")) {
        updateBoundInput(target);
        render();
      }
    });

    window.addEventListener("resize", () => requestAnimationFrame(drawPlan));

    render();
    if (state.weather.enabled && !state.weather.current && !weatherAutoStarted) {
      weatherAutoStarted = true;
      setTimeout(refreshWeather, 400);
    }
  </script>
</body>
</html>
